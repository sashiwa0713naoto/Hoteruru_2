<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{fragment :: meta}"></div>
    <div th:replace="~{fragment :: styles}"></div>
    <title>民宿一覧 | SAMURAI Travel</title>
</head>
<body>
    <div class="samuraitravel-wrapper">
        <!-- ヘッダー -->
        <div th:replace="~{fragment :: header}"></div>

        <main>
            <div class="container-fluid pt-4 pb-5 samuraitravel-container">
                <div class="row justify-content-center">
                    <div class="col-xl-11 col-lg-12">
                        
                        <h1 class="mb-4 text-center">民宿一覧</h1>
                        
                        <!-- 検索フォーム & 並び替えセレクトボックス -->
                        <div class="d-flex justify-content-between align-items-end flex-wrap mb-3">
                            <form method="get" th:action="@{/houses}" class="mb-3 mb-md-0">
                                <div class="input-group">
                                    <input type="hidden" name="sort" th:value="${param.sort}">
                                    <input type="hidden" name="area" th:value="${param.area}">
                                    <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="キーワード検索">
                                    <button type="submit" class="btn btn-primary text-white samuraitravel-btn">検索</button>
                                </div>
                            </form>

                            <form method="get" th:action="@{/houses}" class="mb-3 mb-md-0">
                                <input type="hidden" name="keyword" th:value="${keyword}">
                                <input type="hidden" name="area" th:value="${param.area}">
                                <select class="form-select form-select-sm" name="sort" onchange="this.form.submit()">
                                    <option value="" disabled selected hidden>並び替えを選択</option>
                                    <option value="price,asc" th:selected="${param.sort != null and param.sort[0] == 'price,asc'}">宿泊料金が安い順</option>
                                    <option value="price,desc" th:selected="${param.sort != null and param.sort[0] == 'price,desc'}">宿泊料金が高い順</option>
                                </select>
                            </form>
                        </div>

                        <!-- 現在の絞り込み表示 -->
                        <div class="mb-3" th:if="${area != null and !area.isEmpty()}">
                            <span class="badge bg-primary fs-6">
                                選択中の地域: <span th:text="${area}"></span>
                            </span>
                            <a th:href="@{/houses(keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-sm ms-2">地域選択を解除</a>
                        </div>

                        <!-- 民宿一覧テーブル -->
                        <div th:if="${housePage != null and !housePage.empty}">
                            <table class="table table-striped table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th scope="col">民宿画像</th>
                                        <th scope="col">民宿名</th>
                                        <th scope="col">郵便番号</th>
                                        <th scope="col">住所</th>
                                        <th scope="col">電話番号</th>
                                        <th scope="col" class="text-center">詳細</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="house : ${housePage}">
                                        <td>
                                            <div th:if="${house.imageName != null and !house.imageName.isEmpty()}">
                                                <img th:src="@{/storage/__${house.imageName}__}" alt="民宿画像" style="width: 80px; height: 60px; object-fit: cover;" class="img-fluid">
                                            </div>
                                            <div th:unless="${house.imageName != null and !house.imageName.isEmpty()}">
                                                <img th:src="@{/images/noImage.png}" alt="no image" style="width: 80px; height: 60px; object-fit: cover;" class="img-fluid">
                                            </div>
                                        </td>
                                        <td th:text="${house.getName()}"></td>
                                        <td th:text="${house.getPostalCode()}"></td>
                                        <td th:text="${house.getAddress()}"></td>
                                        <td th:text="${house.getPhoneNumber()}"></td>
                                        <td class="text-center">
                                            <a th:href="@{/houses/{id}(id=${house.getId()})}">詳細</a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>

                            <!-- ページネーション -->
                            <div th:if="${housePage.totalPages > 1}" class="d-flex justify-content-center mt-4">
                                <nav aria-label="民宿一覧ページ">
                                    <ul class="pagination">
                                        <li class="page-item" th:classappend="${housePage.first} ? 'disabled'">
                                            <a class="page-link" th:href="@{/houses(page=${housePage.number - 1}, keyword=${keyword}, area=${param.area}, sort=${param.sort})}">前へ</a>
                                        </li>
                                        <li class="page-item" th:each="i : ${#numbers.sequence(0, housePage.totalPages - 1)}" th:classappend="${i == housePage.number} ? 'active'">
                                            <a class="page-link" th:href="@{/houses(page=${i}, keyword=${keyword}, area=${param.area}, sort=${param.sort})}" th:text="${i + 1}">1</a>
                                        </li>
                                        <li class="page-item" th:classappend="${housePage.last} ? 'disabled'">
                                            <a class="page-link" th:href="@{/houses(page=${housePage.number + 1}, keyword=${keyword}, area=${param.area}, sort=${param.sort})}">次へ</a>
                                        </li>
                                    </ul>
                                </nav>
                            </div>
                        </div>

                        <div th:if="${housePage == null or housePage.empty}" class="text-center my-4">
                            <p>該当する民宿はありません。</p>
                        </div>

                        <!-- ▼ クリックして絞り込めるように修正した地域検索エリア -->
                        <div class="mt-4 pt-3 border-top">
                            <h6 class="fw-bold mb-3">地域から民宿を探す</h6>
                            <div class="table-responsive">
                                <table class="table table-borderless align-middle mb-0" style="background: transparent;">
                                    <tbody>
                                        <tr>
                                            <th scope="row" style="width: 130px;" class="ps-0 text-nowrap">
                                                <a th:href="@{/houses(area='北海道・東北', keyword=${keyword}, sort=${param.sort})}" class="text-decoration-none fw-bold text-primary small">北海道・東北</a>
                                            </th>
                                            <td class="pe-0">
                                                <a th:href="@{/houses(area='北海道', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">北海道</a>
                                                <a th:href="@{/houses(area='青森', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">青森</a>
                                                <a th:href="@{/houses(area='岩手', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">岩手</a>
                                                <a th:href="@{/houses(area='宮城', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">宮城</a>
                                                <a th:href="@{/houses(area='秋田', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">秋田</a>
                                                <a th:href="@{/houses(area='山形', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">山形</a>
                                                <a th:href="@{/houses(area='福島', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">福島</a>
                                            </td>
                                        </tr>
                                        <tr>
                                            <th scope="row" class="ps-0 text-nowrap">
                                                <a th:href="@{/houses(area='関東', keyword=${keyword}, sort=${param.sort})}" class="text-decoration-none fw-bold text-primary small">関東</a>
                                            </th>
                                            <td class="pe-0">
                                                <a th:href="@{/houses(area='茨城', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">茨城</a>
                                                <a th:href="@{/houses(area='栃木', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">栃木</a>
                                                <a th:href="@{/houses(area='群馬', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">群馬</a>
                                                <a th:href="@{/houses(area='埼玉', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">埼玉</a>
                                                <a th:href="@{/houses(area='千葉', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">千葉</a>
                                                <a th:href="@{/houses(area='東京', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">東京</a>
                                                <a th:href="@{/houses(area='神奈川', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">神奈川</a>
                                            </td>
                                        </tr>
                                        <tr>
                                            <th scope="row" class="ps-0 text-nowrap">
                                                <a th:href="@{/houses(area='中部', keyword=${keyword}, sort=${param.sort})}" class="text-decoration-none fw-bold text-primary small">中部</a>
                                            </th>
                                            <td class="pe-0">
                                                <a th:href="@{/houses(area='新潟', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">新潟</a>
                                                <a th:href="@{/houses(area='富山', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">富山</a>
                                                <a th:href="@{/houses(area='石川', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">石川</a>
                                                <a th:href="@{/houses(area='福井', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">福井</a>
                                                <a th:href="@{/houses(area='山梨', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">山梨</a>
                                                <a th:href="@{/houses(area='長野', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">長野</a>
                                                <a th:href="@{/houses(area='岐阜', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">岐阜</a>
                                                <a th:href="@{/houses(area='静岡', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">静岡</a>
                                                <a th:href="@{/houses(area='愛知', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">愛知</a>
                                            </td>
                                        </tr>
                                        <tr>
                                            <th scope="row" class="ps-0 text-nowrap">
                                                <a th:href="@{/houses(area='近畿', keyword=${keyword}, sort=${param.sort})}" class="text-decoration-none fw-bold text-primary small">近畿</a>
                                            </th>
                                            <td class="pe-0">
                                                <a th:href="@{/houses(area='三重', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">三重</a>
                                                <a th:href="@{/houses(area='滋賀', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">滋賀</a>
                                                <a th:href="@{/houses(area='京都', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">京都</a>
                                                <a th:href="@{/houses(area='大阪', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">大阪</a>
                                                <a th:href="@{/houses(area='兵庫', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">兵庫</a>
                                                <a th:href="@{/houses(area='奈良', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">奈良</a>
                                                <a th:href="@{/houses(area='和歌山', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">和歌山</a>
                                            </td>
                                        </tr>
                                        <tr>
                                            <th scope="row" class="ps-0 text-nowrap">
                                                <a th:href="@{/houses(area='中国', keyword=${keyword}, sort=${param.sort})}" class="text-decoration-none fw-bold text-primary small">中国</a>
                                            </th>
                                            <td class="pe-0">
                                                <a th:href="@{/houses(area='鳥取', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">鳥取</a>
                                                <a th:href="@{/houses(area='島根', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">島根</a>
                                                <a th:href="@{/houses(area='岡山', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">岡山</a>
                                                <a th:href="@{/houses(area='広島', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">広島</a>
                                                <a th:href="@{/houses(area='山口', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">山口</a>
                                            </td>
                                        </tr>
                                        <tr>
                                            <th scope="row" class="ps-0 text-nowrap">
                                                <a th:href="@{/houses(area='四国', keyword=${keyword}, sort=${param.sort})}" class="text-decoration-none fw-bold text-primary small">四国</a>
                                            </th>
                                            <td class="pe-0">
                                                <a th:href="@{/houses(area='徳島', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">徳島</a>
                                                <a th:href="@{/houses(area='香川', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">香川</a>
                                                <a th:href="@{/houses(area='愛媛', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">愛媛</a>
                                                <a th:href="@{/houses(area='高知', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">高知</a>
                                            </td>
                                        </tr>
                                        <tr>
                                            <th scope="row" class="ps-0 text-nowrap">
                                                <a th:href="@{/houses(area='九州・沖縄', keyword=${keyword}, sort=${param.sort})}" class="text-decoration-none fw-bold text-primary small">九州・沖縄</a>
                                            </th>
                                            <td class="pe-0">
                                                <a th:href="@{/houses(area='福岡', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">福岡</a>
                                                <a th:href="@{/houses(area='佐賀', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">佐賀</a>
                                                <a th:href="@{/houses(area='長崎', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">長崎</a>
                                                <a th:href="@{/houses(area='熊本', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">熊本</a>
                                                <a th:href="@{/houses(area='大分', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">大分</a>
                                                <a th:href="@{/houses(area='宮崎', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">宮崎</a>
                                                <a th:href="@{/houses(area='鹿児島', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">鹿児島</a>
                                                <a th:href="@{/houses(area='沖縄', keyword=${keyword}, sort=${param.sort})}" class="btn btn-outline-secondary btn-xs px-2 py-0 me-1 mb-1" style="font-size: 0.8rem;">沖縄</a>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </main>

        <div th:replace="~{fragment :: footer}"></div>
    </div>

    <div th:replace="~{fragment :: scripts}"></div>
</body>
</html>
