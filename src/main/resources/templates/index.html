<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS の読み込み（画面デザイン・レスポンシブ用） -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <!-- アプリケーション独自のカスタムCSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>SAMURAI Travel</title>
</head>
<body>

    <!-- 1. 共通ヘッダーの読み込み（fragment.html の header を差し替え表示） -->
    <div th:replace="~{fragment :: header}"></div>

    <main>
        <!-- 2. トップページのメインコンテンツ（ヒーローセクション） -->
        <div class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-8 text-center">
                    <h1 class="display-5 fw-bold mb-3">SAMURAI Travelへようこそ</h1>
                    <p class="lead text-muted mb-4">日本各地の素敵な民宿を検索・予約できます。</p>

                    <!-- 3. メインアクションボタン（ナビゲーション） -->
                    <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                        <a th:href="@{/houses}" class="btn btn-primary btn-lg px-4 gap-3">民宿一覧を見る</a>
                        <a th:href="@{/signup}" class="btn btn-outline-secondary btn-lg px-4">新規会員登録</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 4. 共通フッターの読み込み（fragment.html の footer を差し替え表示） -->
    <div th:replace="~{fragment :: footer}"></div>

    <!-- Bootstrap JS （ドロップダウンやレスポンシブメニューの動作に必須） -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
</body>
</html>
