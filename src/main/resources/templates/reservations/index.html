<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <!-- ヘッダー共通パーツなどの読み込み -->
        <div th:replace="~{fragment :: meta}"></div>
        <div th:replace="~{fragment :: styles}"></div>
        <title>予約一覧</title>
    </head>
    <body>
        <div class="moat-wrapper">
            <!-- ヘッダー -->
            <div th:replace="~{fragment :: header}"></div>

            <main>
                <div class="container moat-container pb-5">
                    <div class="row justify-content-center">
                        <div class="col-xxl-9 col-xl-10 col-lg-11">
                            
                            <!-- パンくずリスト -->
                            <nav class="my-3" style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
                                <ol class="breadcrumb mb-0">
                                    <li class="breadcrumb-item"><a th:href="@{/}">ホーム</a></li>
                                    <li class="breadcrumb-item active" aria-current="page">予約一覧</li>
                                </ol>
                            </nav>

                            <h1 class="mb-3 text-center">予約一覧</h1>

                            <!-- 完了メッセージなどがあれば表示 -->
                            <div th:if="${successMessage}" class="alert alert-info">
                                <span th:text="${successMessage}"></span>
                            </div>

                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th scope="col">民宿名</th>
                                        <th scope="col">チェックイン日</th>
                                        <th scope="col">チェックアウト日</th>
                                        <th scope="col">宿泊料金</th>
                                    </tr>
                                </thead>
                                <tbody>
									<tr th:each="reservation : ${reservationPage}">
										 <td th:text="${reservation.id}"></td>
									    <td th:text="${reservation.house.name}"></td>
                                        </td>
                                        <td th:text="${reservation.checkinDate}"></td>
                                        <td th:text="${reservation.checkoutDate}"></td>
                                        <td th:text="${#numbers.formatInteger(reservation.amount, 1, 'COMMA') + '円'}"></td>
                                    </tr>
                                </tbody>
                            </table>

                            <!-- ページネーション -->
                            <div th:if="${reservationPage.totalPages > 1}" class="d-flex justify-content-center">
                                <nav aria-label="予約一覧ページ">
                                    <ul class="pagination">
                                        <li class="page-item" th:classappend="${reservationPage.first} ? 'disabled'">
                                            <a class="page-link" th:href="@{/reservations(page=${reservationPage.number - 1})}">前</a>
                                        </li>
                                        <li class="page-item" th:classappend="${i == reservationPage.number} ? 'active'" th:each="i : ${#numbers.sequence(0, reservationPage.totalPages - 1)}">
                                            <a class="page-link" th:href="@{/reservations(page=${i})}" th:text="${i + 1}"></a>
                                        </li>
                                        <li class="page-item" th:classappend="${reservationPage.last} ? 'disabled'">
                                            <a class="page-link" th:href="@{/reservations(page=${reservationPage.number + 1})}">次</a>
                                        </li>
                                    </ul>
                                </nav>
                            </div>

                        </div>
                    </div>
                </div>
            </main>

            <!-- フッター -->
            <div th:replace="~{fragment :: footer}"></div>
        </div>

        <div th:replace="~{fragment :: scripts}"></div>
    </body>
</html>
