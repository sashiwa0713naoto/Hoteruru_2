<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <!-- 共通フラグメントの読み込み -->
    <div th:replace="~{fragment :: meta}"></div>
    <div th:replace="~{fragment :: styles}"></div>
    <title>メール認証 | SAMURAI Travel</title>
</head>
<body>
    <div class="samuraitravel-wrapper">
        <!-- ヘッダー -->
        <div th:replace="~{fragment :: header}"></div>

        <main>
            <div class="container pt-4 pb-5 samuraitravel-container">
                <div class="row justify-content-center">
                    <div class="col-xl-5 col-lg-6 col-md-8 text-center">
                        
                        <h1 class="mb-4 fs-2">メール認証</h1>

                        <!-- 認証成功メッセージ -->
                        <div th:if="${successMessage}" class="alert alert-info mb-4" role="alert">
                            <span th:text="${successMessage}"></span>
                        </div>

                        <!-- 認証失敗エラーメッセージ -->
                        <div th:if="${errorMessage}" class="alert alert-danger mb-4" role="alert">
                            <span th:text="${errorMessage}"></span>
                        </div>

                        <!-- ログイン画面へのボタン -->
                        <div class="d-flex justify-content-center my-4">
                            <a th:href="@{/login}" class="btn btn-primary text-white shadow-sm w-100 samuraitravel-btn">ログイン画面へ</a>
                        </div>

                    </div>
                </div>
            </div>
        </main>

        <!-- フッター -->
        <div th:replace="~{fragment :: footer}"></div>
    </div>

    <!-- 共通スクリプト（Bootstrap等） -->
    <div th:replace="~{fragment :: scripts}"></div>
</body>
</html>
