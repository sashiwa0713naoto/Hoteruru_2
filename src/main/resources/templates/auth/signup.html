<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <!-- 共通フラグメントの読み込み -->
        <div th:replace="~{fragment :: meta}"></div>
        <div th:replace="~{fragment :: styles}"></div>
        <title>会員登録 | SAMURAI Travel</title>
    </head>
    <body>
        <div class="samuraitravel-wrapper">
            <!-- ヘッダー -->
            <div th:replace="~{fragment :: header}"></div>

            <!-- メインコンテンツ -->
            <main>
                <div class="container pt-4 pb-5 samuraitravel-container">
                    <div class="row justify-content-center">
                        <div class="col-xl-5 col-lg-6 col-md-8">
                            
                            <h1 class="mb-4 text-center fs-2">会員登録</h1>

                            <!-- 会員登録フォーム -->
                            <form method="post" th:action="@{/signup}" th:object="${signupForm}">
                                <!-- ロールIDの隠しフィールド（一般ユーザー用: 1） -->
                                <input type="hidden" th:field="*{roleId}" value="1">

                                <!-- 氏名 -->
                                <div class="form-group mb-3">
                                    <label for="name" class="form-label fw-bold">氏名</label>
                                    <input type="text" class="form-control" th:field="*{name}" autofocus autocomplete="name" placeholder="侍 太郎">
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                </div>

                                <!-- フリガナ -->
                                <div class="form-group mb-3">
                                    <label for="furigana" class="form-label fw-bold">フリガナ</label>
                                    <input type="text" class="form-control" th:field="*{furigana}" placeholder="サムライ タロウ">
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('furigana')}" th:errors="*{furigana}"></div>
                                </div>

                                <!-- 郵便番号 -->
                                <div class="form-group mb-3">
                                    <label for="postalCode" class="form-label fw-bold">郵便番号</label>
                                    <input type="text" class="form-control" th:field="*{postalCode}" placeholder="123-4567">
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('postalCode')}" th:errors="*{postalCode}"></div>
                                </div>

                                <!-- 住所 -->
                                <div class="form-group mb-3">
                                    <label for="address" class="form-label fw-bold">住所</label>
                                    <input type="text" class="form-control" th:field="*{address}" placeholder="東京都千代田区神田練塀町300番地">
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                                </div>

                                <!-- 電話番号 -->
                                <div class="form-group mb-3">
                                    <label for="phoneNumber" class="form-label fw-bold">電話番号</label>
                                    <input type="text" class="form-control" th:field="*{phoneNumber}" placeholder="090-1234-5678">
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                                </div>

                                <!-- メールアドレス -->
                                <div class="form-group mb-3">
                                    <label for="email" class="form-label fw-bold">メールアドレス</label>
                                    <input type="email" class="form-control" th:field="*{email}" placeholder="samurai@example.com" autocomplete="email">
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                </div>

                                <!-- パスワード -->
                                <div class="form-group mb-3">
                                    <label for="password" class="form-label fw-bold">パスワード</label>
                                    <input type="password" class="form-control" th:field="*{password}" placeholder="半角英数字8文字以上" autocomplete="new-password">
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                                </div>

                                <!-- パスワード（確認用） -->
                                <div class="form-group mb-4">
                                    <label for="passwordConfirmation" class="form-label fw-bold">パスワード（確認用）</label>
                                    <input type="password" class="form-control" th:field="*{passwordConfirmation}" placeholder="パスワードを再度入力してください" autocomplete="new-password">
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('passwordConfirmation')}" th:errors="*{passwordConfirmation}"></div>
                                </div>

                                <!-- 登録ボタン -->
                                <div class="form-group d-flex justify-content-center my-4">
                                    <button type="submit" class="btn btn-primary text-white shadow-sm w-100 samuraitravel-btn">登録</button>
                                </div>
                            </form>

                            <hr class="my-4">

                            <!-- ログイン画面への導線 -->
                            <div class="text-center">
                                <p class="mb-0">すでにアカウントをお持ちですか？</p>
                                <a th:href="@{/login}" class="sm-link">ログインはこちら</a>
                            </div>

                        </div>
                    </div>
                </div>
            </main>

            <!-- フッター -->
            <div th:replace="~{fragment :: footer}"></div>
        </div>

        <!-- 共通スクリプト（Bootstrap等） -->
        <div th:replace="~{fragment :: scripts}"></div>
    </body>
</html>
