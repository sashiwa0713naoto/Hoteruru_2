<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <!-- 共通フラグメントの読み込み -->
    <div th:replace="~{fragment :: meta}"></div>
    <div th:replace="~{fragment :: styles}"></div>
    <title>ログイン | SAMURAI Travel</title>
</head>
<body>
    <div class="samuraitravel-wrapper">
        <!-- ヘッダー -->
        <div th:replace="~{fragment :: header}"></div>

        <main>
            <div class="container pt-4 pb-5 samuraitravel-container">
                <div class="row justify-content-center">
                    <div class="col-xl-5 col-lg-6 col-md-8">
                        
                        <h1 class="mb-4 text-center fs-2">ログイン</h1>

                        <!-- エラーメッセージ（Spring Securityの認証失敗時） -->
                        <div th:if="${param.error}" class="alert alert-danger text-center">
                            メールアドレスまたはパスワードが正しくありません。
                        </div>

                        <!-- ログアウト成功メッセージ -->
                        <div th:if="${param.logout}" class="alert alert-info text-center">
                            ログアウトしました。
                        </div>

                        <!-- 会員登録完了メッセージなど（リダイレクト時パラメータ受取） -->
                        <div th:if="${param.registered}" class="alert alert-info text-center">
                            会員登録が完了しました。ログインしてください。
                        </div>

                        <!-- ログインフォーム -->
                        <form th:action="@{/login}" method="post">
                            <div class="form-group mb-3">
                                <label for="email" class="form-label fw-bold">メールアドレス</label>
                                <input type="email" class="form-control" id="email" name="username" placeholder="メールアドレス" autocomplete="email" autofocus required>
                            </div>
                            
                            <div class="form-group mb-4">
                                <label for="password" class="form-label fw-bold">パスワード</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="パスワード" autocomplete="current-password" required>
                            </div>

                            <div class="form-group d-flex justify-content-center my-4">
                                <button type="submit" class="btn btn-primary text-white shadow-sm w-100 samuraitravel-btn">ログイン</button>
                            </div>
                        </form>

                        <hr class="my-4">

                        <!-- 新規会員登録への導線 -->
                        <div class="text-center">
                            <p class="mb-0">アカウントをお持ちでないですか？</p>
                            <a th:href="@{/signup}" class="sm-link">新規会員登録はこちら</a>
                        </div>

                    </div>
                </div>
            </div>
        </main>

        <!-- フッター -->
        <div th:replace="~{fragment :: footer}"></div>
    </div>

    <!-- 共通スクリプト（Bootstrap等） -->
    <div th:replace="~{fragment :: scripts}"></div>
</body>
</html>
