<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <div th:replace="~{admin/fragment :: meta}"></div>
    <div th:replace="~{admin/fragment :: styles}"></div>
    <title>会員詳細 | SAMURAI Travel</title>
</head>
<body>
    <div class="samuraitravel-wrapper">
        <!-- ヘッダー（管理者用） -->
        <div th:replace="~{admin/fragment :: header}"></div>

        <main>
            <div class="container pt-4 pb-5 samuraitravel-container">
                <div class="row justify-content-center">
                    <div class="col-xl-5 col-lg-6 col-md-8">
                        <!-- パンくずリスト -->
                        <nav class="mb-4" style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
                            <ol class="breadcrumb mb-0">
                                <li class="breadcrumb-item"><a th:href="@{/admin/users}">会員一覧</a></li>
                                <li class="breadcrumb-item active" aria-current="page">会員詳細</li>
                            </ol>
                        </nav>

                        <h1 class="mb-4 text-center fs-2">会員詳細</h1>

                        <!-- 会員情報テーブル -->
                        <div class="container mb-4">
                            <div class="row pb-2 mb-2 border-bottom">
                                <div class="col-4 fw-bold">ID</div>
                                <div class="col-8" th:text="${user.id}"></div>
                            </div>

                            <div class="row pb-2 mb-2 border-bottom">
                                <div class="col-4 fw-bold">氏名</div>
                                <div class="col-8" th:text="${user.name}"></div>
                            </div>

                            <div class="row pb-2 mb-2 border-bottom">
                                <div class="col-4 fw-bold">フリガナ</div>
                                <div class="col-8" th:text="${user.furigana}"></div>
                            </div>

                            <div class="row pb-2 mb-2 border-bottom">
                                <div class="col-4 fw-bold">郵便番号</div>
                                <div class="col-8" th:text="${user.postalCode}"></div>
                            </div>

                            <div class="row pb-2 mb-2 border-bottom">
                                <div class="col-4 fw-bold">住所</div>
                                <div class="col-8" th:text="${user.address}"></div>
                            </div>

                            <div class="row pb-2 mb-2 border-bottom">
                                <div class="col-4 fw-bold">電話番号</div>
                                <div class="col-8" th:text="${user.phoneNumber}"></div>
                            </div>

                            <div class="row pb-2 mb-4 border-bottom">
                                <div class="col-4 fw-bold">メールアドレス</div>
                                <div class="col-8" th:text="${user.email}"></div>
                            </div>
                        </div>

                        <!-- 編集・削除・一覧に戻るボタン -->
                        <div class="d-flex justify-content-center align-items-center flex-column">
                            <div class="d-flex justify-content-between w-100 mb-3">
                                <a th:href="@{/admin/users/__${user.id}__/edit}" class="btn btn-primary text-white shadow-sm samuraitravel-btn" style="width: 48%;">編集</a>
                                <button type="button" class="btn btn-danger text-white shadow-sm" style="width: 48%;" data-bs-toggle="modal" data-bs-target="#deleteUserModal">削除</button>
                            </div>
                            <a th:href="@{/admin/users}" class="btn btn-outline-secondary w-100">会員一覧に戻る</a>
                        </div>

                        <!-- 削除確認モーダル -->
                        <div class="modal fade" id="deleteUserModal" tabindex="-1" aria-labelledby="deleteUserModalLabel" aria-hidden="true">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-title" id="deleteUserModalLabel" th:text="${user.name + '様を削除してもよろしいですか？'}"></h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
                                    </div>
                                    <div class="modal-footer">
                                        <form method="post" th:action="@{/admin/users/__${user.id}__/delete}">
                                            <button type="submit" class="btn btn-danger text-white shadow-sm">削除</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </main>

        <!-- フッター（管理者用） -->
        <div th:replace="~{admin/fragment :: footer}"></div>
    </div>

    <!-- Bootstrap JS（管理者用） -->
    <div th:replace="~{admin/fragment :: scripts}"></div>
</body>
</html>
