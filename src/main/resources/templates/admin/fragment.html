<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
    <head>
        <!-- 1. メタ情報の共通フラグメント -->
        <div th:fragment="meta" th:remove="tag">
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
        </div>                        
        
        <!-- 2. CSS・フォントリンク等の共通フラグメント -->
        <div th:fragment="styles" th:remove="tag">
            <!-- Bootstrap 5 CSS -->
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
            
            <!-- Google Fonts (Noto Sans JP) -->
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
            
            <!-- アプリケーション独自CSS -->
            <link th:href="@{/css/style.css}" rel="stylesheet">
        </div>   
        
        <title>部品化用のHTMLファイル</title>     
    </head>
    <body>
        <!-- 3. 共通ヘッダー（管理者メニュー対応）のフラグメント -->
        <div th:fragment="header" th:remove="tag">
            <nav class="navbar navbar-expand-md navbar-light bg-white shadow-sm moattravel-navbar">
                <div class="container moattravel-container">
                    <!-- トップページへのロゴリンク -->
                    <a class="navbar-brand" th:href="@{/}">                        
                        <img class="moattravel-logo me-1" th:src="@{/images/logo.png}" alt="moat Travel">                        
                    </a>
                    
                    <!-- レスポンシブ用ハンバーガーメニューボタン -->
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav ms-auto">
                            <!-- 管理者権限（ROLE_ADMIN）を所持している場合のみ表示されるドロップダウンメニュー -->
                            <li class="nav-item dropdown" th:if="${#authorization.expression('hasRole(''ROLE_ADMIN'')')}">
                                <a id="navbarDropdown" class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false" v-pre>
                                    管理者メニュー
                                </a>
                                <div class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                                    <a class="dropdown-item" th:href="@{/admin/houses}">民宿一覧</a>
                                    <a class="dropdown-item" th:href="@{/admin/reservations}">予約一覧</a>
                                    <a class="dropdown-item" th:href="@{/admin/users}">会員一覧</a>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </div>
        
        <!-- 4. 共通フッターのフラグメント -->
        <div th:fragment="footer" th:remove="tag">
            <footer>
                <div class="d-flex justify-content-center align-items-center h-100">
                    <p class="text-center text-muted small mb-0">&copy; moat Travel All rights reserved.</p>      
                </div>                 
            </footer>
        </div>
    
        <!-- 5. 共通 JavaScript スクリプトのフラグメント -->
        <div th:fragment="scripts" th:remove="tag">
            <!-- Bootstrap 5 JS Bundle -->
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
        </div>
    </body>
</html>
