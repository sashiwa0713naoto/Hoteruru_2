<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <!-- 管理者専用フラグメントの読み込み -->
    <div th:replace="~{admin/fragment :: meta}"></div>
    <div th:replace="~{admin/fragment :: styles}"></div>
    <title>民宿登録</title>
</head>
<body>
    <div class="samuraitravel-wrapper">
        <!-- ヘッダー（管理者用） -->
        <div th:replace="~{admin/fragment :: header}"></div>

        <main>
            <div class="container pt-4 pb-5 samuraitravel-container">
                <div class="row justify-content-center">
                    <div class="col-xl-7 col-lg-8 col-md-10">
                        <!-- パンくずリスト -->
                        <nav class="mb-4" style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
                            <ol class="breadcrumb mb-0">
                                <li class="breadcrumb-item"><a th:href="@{/admin/houses}">民宿一覧</a></li>
                                <li class="breadcrumb-item active" aria-current="page">民宿登録</li>
                            </ol>
                        </nav>

                        <h1 class="mb-4 text-center fs-2">民宿登録</h1>

                        <!-- 民宿新規登録フォーム（画像添付のため multipart/form-data を指定） -->
                        <form method="post" th:action="@{/admin/houses/create}" th:object="${houseRegisterForm}" enctype="multipart/form-data">
                            
                            <!-- 民宿名 -->
                            <div class="form-group row mb-3">
                                <label for="name" class="col-md-3 col-form-label text-md-end fw-bold">民宿名</label>
                                <div class="col-md-9">
                                    <div th:if="${#fields.hasErrors('name')}" class="text-danger small mb-2" th:errors="*{name}"></div>
                                    <input type="text" class="form-control" th:field="*{name}" autofocus>
                                </div>
                            </div>

                            <!-- 民宿画像（ファイルアップロード） -->
                            <div class="form-group row mb-3">
                                <label for="imageFile" class="col-md-3 col-form-label text-md-end fw-bold">民宿画像</label>
                                <div class="col-md-9">
                                    <div th:if="${#fields.hasErrors('imageFile')}" class="text-danger small mb-2" th:errors="*{imageFile}"></div>
                                    <input type="file" class="form-control" th:field="*{imageFile}" id="imageFile">
                                </div>
                            </div>

                            <!-- 選択した画像のリアルタイムプレビュー領域（初期状態は d-none で非表示） -->
                            <div class="row mb-3">
                                <div class="col-md-9 offset-md-3">
                                    <img src="#" id="imagePreview" class="w-100 rounded d-none" alt="プレビュー画像">
                                </div>
                            </div>

                            <!-- 説明 -->
                            <div class="form-group row mb-3">
                                <label for="description" class="col-md-3 col-form-label text-md-end fw-bold">説明</label>
                                <div class="col-md-9">
                                    <div th:if="${#fields.hasErrors('description')}" class="text-danger small mb-2" th:errors="*{description}"></div>
                                    <textarea class="form-control" th:field="*{description}" cols="30" rows="5"></textarea>
                                </div>
                            </div>

                            <!-- 宿泊料金 -->
                            <div class="form-group row mb-3">
                                <label for="price" class="col-md-3 col-form-label text-md-end fw-bold">宿泊料金（単位：円）</label>
                                <div class="col-md-9">
                                    <div th:if="${#fields.hasErrors('price')}" class="text-danger small mb-2" th:errors="*{price}"></div>
                                    <input type="number" class="form-control" th:field="*{price}">
                                </div>
                            </div>

                            <!-- 定員 -->
                            <div class="form-group row mb-3">
                                <label for="capacity" class="col-md-3 col-form-label text-md-end fw-bold">定員（単位：人）</label>
                                <div class="col-md-9">
                                    <div th:if="${#fields.hasErrors('capacity')}" class="text-danger small mb-2" th:errors="*{capacity}"></div>
                                    <input type="number" class="form-control" th:field="*{capacity}">
                                </div>
                            </div>

                            <!-- 郵便番号 -->
                            <div class="form-group row mb-3">
                                <label for="postalCode" class="col-md-3 col-form-label text-md-end fw-bold">郵便番号</label>
                                <div class="col-md-9">
                                    <div th:if="${#fields.hasErrors('postalCode')}" class="text-danger small mb-2" th:errors="*{postalCode}"></div>
                                    <input type="text" class="form-control" th:field="*{postalCode}">
                                </div>
                            </div>

                            <!-- 住所 -->
                            <div class="form-group row mb-3">
                                <label for="address" class="col-md-3 col-form-label text-md-end fw-bold">住所</label>
                                <div class="col-md-9">
                                    <div th:if="${#fields.hasErrors('address')}" class="text-danger small mb-2" th:errors="*{address}"></div>
                                    <input type="text" class="form-control" th:field="*{address}">
                                </div>
                            </div>

                            <!-- 電話番号 -->
                            <div class="form-group row mb-3">
                                <label for="phoneNumber" class="col-md-3 col-form-label text-md-end fw-bold">電話番号</label>
                                <div class="col-md-9">
                                    <div th:if="${#fields.hasErrors('phoneNumber')}" class="text-danger small mb-2" th:errors="*{phoneNumber}"></div>
                                    <input type="text" class="form-control" th:field="*{phoneNumber}">
                                </div>
                            </div>

                            <!-- 登録ボタン -->
                            <div class="form-group d-flex justify-content-center my-4">
                                <button type="submit" class="btn text-white shadow-sm w-50 samuraitravel-btn">登録</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>

        <!-- フッター（管理者用） -->
        <div th:replace="~{admin/fragment :: footer}"></div>
    </div>

    <!-- Bootstrap JS（管理者用） -->
    <div th:replace="~{admin/fragment :: scripts}"></div>

    <!-- ファイル選択時にプレビュー表示を動的に制御するJavaScript -->
    <script>
        document.getElementById('imageFile').addEventListener('change', function (event) {
            const file = event.target.files[0];
            const preview = document.getElementById('imagePreview');
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    preview.setAttribute('src', e.target.result);
                    preview.classList.remove('d-none'); // 画像読み込み成功時に非表示クラスを取り除く
                }
                reader.readAsDataURL(file);
            } else {
                preview.setAttribute('src', '#');
                preview.classList.add('d-none'); // 未選択状態に戻った場合は非表示にする
            }
        });
    </script>
</body>
</html>
