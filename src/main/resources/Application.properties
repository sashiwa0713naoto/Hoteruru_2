# アプリケーションの名前を「moattravel」に設定する
spring.application.name=moattravel

# アプリケーションを起動するポート番号を8080番に指定する
server.port=8080

# 接続するMySQLデータベースの場所や文字コード、タイムゾーンを指定する
spring.datasource.url=jdbc:mysql://localhost:3306/moattravel2_db?useSSL=false&serverTimezone=Asia/Tokyo&allowPublicKeyRetrieval=true&characterEncoding=UTF-8

# データベースに接続するためのユーザー名を指定する
spring.datasource.username=root

# データベースに接続するためのパスワードを指定する
spring.datasource.password=Sashiwa0713!

# MySQLデータベースと通信するためのドライバーを指定する
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 初回のみ「create」にしてまっさらにし、普段は「update」にする
spring.jpa.hibernate.ddl-auto=update

# 初期データ（SQL）を自動読み込みする設定を追加
spring.sql.init.encoding=utf-8
spring.sql.init.mode=always

# 実行されたSQL文をコンソール画面に出力して確認できるようにする
spring.jpa.show-sql=true

# メール送信に利用するGmailのサーバーアドレスを指定する
spring.mail.host=smtp.gmail.com

# メール送信用のポート番号を指定する
spring.mail.port=587

# メール送信元となるGmailのアドレスを指定する
spring.mail.username=sashiwa0713naoto@gmail.com

# メール送信用のアプリパスワードを指定する
spring.mail.password=kozmohaoszzabtnr

# メール送信時に認証を行うよう設定する
spring.mail.properties.mail.smtp.auth=true

# メール送信時の通信を暗号化（STARTTLS）するよう設定する
spring.mail.properties.mail.smtp.starttls.enable=true

