# データベースの接続先URLを指定する（環境変数から読み込む設定）
spring.datasource.url=${DB_URL}

# データベースのユーザー名を指定する（環境変数から読み込む設定）
spring.datasource.username=${DB_USERNAME}

# データベースのパスワードを指定する（環境変数から読み込む設定）
spring.datasource.password=${DB_PASSWORD}

# MySQLデータベースと通信するためのドライバーを指定する
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 初期化用SQLファイルの文字コードをUTF-8に指定する
spring.sql.init.encoding=utf-8

# データベースの初期化を常に実行するよう指定する
spring.sql.init.mode=always

# アップロードできるファイルの最大サイズを5MBに制限する
spring.servlet.multipart.max-file-size=5MB

# メール送信に利用するGmailのサーバーアドレスを指定する
spring.mail.host=smtp.gmail.com

# メール送信用のポート番号を指定する
spring.mail.port=587